description = "本项只评改值后的计算和报价状态联动。至少以两组有效参数实际检查：①预算及储备变化后相关金额和预算判断更新；②票价系数变化后费用及20%压力金额更新；③日期变化后夜数、逐日明细及汇总更新；④超出原报价日期时出现失效/需重询状态，或清楚标识按旧价暂估。允许离线暂估，不要求自动抓新价。本项不评价推荐对象或原始候选组合的搜索范围。高分须体现真实费用重算：预算/储备、票价和日期三类核心联动中任一类缺失或实质失效，最高0.5；仅显示参数、警告或手工填写新总额，不能证明自动联动。没有可验证的费用重算而只有状态提示，最高0.25。可通过实际回算或独立执行相关公式验证，不把裁判所用软件不支持函数直接认定为模型失效。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf.\n评分为1–5整数。先应用正文中的核心前提和分档上限；正文0/0.25/0.5/0.75/1表示归一化档位，分别对应原始1/2/3/4/5，不得输出小数。五档锚点：5=预算/储备、票价及20%压力、日期与夜数/逐日费用/汇总均正确联动，报价适用状态正确；至少两组有效参数有验证依据。；4=三类核心费用联动均验证成立，仅报价适用状态联动存在实质缺口；不存在用静态旧总额替代回算。；3=至少两类核心费用联动可验证成立，但另一类缺失或实质失效；其他状态提示不能抵消该缺口。；2=仅一类核心费用联动成立，或仅有可核查的报价状态提示/部分实现；没有完整费用回算证据。；1=没有可验证的相关联动实现或检查依据。"
