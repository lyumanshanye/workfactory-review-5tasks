[judge]
judge = "claude-code"
prompt_template = "prompt.md"
model = "qwen3.7-plus"
timeout = 7200
mode = "individual"
weight = 1.0

[[criterion]]
id = "GO001"
name = "GO001"
description = "实际采用的报价和政策可追溯至原始URL、查询时间、适用出行日期及关键条件；明确区分已核实价格、估算和待询价。本项只评来源记录与证据状态，不判断报价换算或缺口对决策的后果。满分须能从所列来源追溯实际采用的关键事实及其状态，而不只是URL、日期或文件名列表。引用内容须与来源主体、版本和适用范围相符；无法复核的已采用关键事实应明确为未核实，不能标为已验证。不要求固定行号或新增截图；网站当前不可访问不等于来源虚假，须结合交付证据和可核实的来源内容判断。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf."
type = "binary"
weight = 7
annotations = { "dimension" = "内容质量-事实忠实性-跨源交叉核对缺失-实际采用事实与原始来源对应", "criterion_type" = "Objective", "criterion_necessity" = "Explicit", "source_type" = "binary", "dimension_l1" = "内容质量", "dimension_l2" = "事实忠实性", "dimension_l3" = "跨源交叉核对缺失", "dimension_l4" = "实际采用事实与原始来源对应", "weakness_ids" = ["W12"] }

[[criterion]]
id = "GO002"
name = "GO002"
description = "五城按县域、行程所涉月份分别正确匹配FY2025/FY2026/FY2027住宿上限及M&IE，实际2026年11至12月预算使用FY2027；辨明餐杂费分项资料适用性，不把自然年等同财政年度。不要求原表行号。本项只评费率取数与适用性。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf.\n评分为1–5整数。先应用正文中的核心前提和分档上限；正文0/0.25/0.5/0.75/1表示归一化档位，分别对应原始1/2/3/4/5，不得输出小数。五档锚点：5=全部应评城市×财政年度记录（五城×三年度共十五组，每组含实际行程所涉月份的住宿上限和M&IE及适用性）满足本项要求。；4=满足要求的城市×财政年度记录（五城×三年度共十五组，每组含实际行程所涉月份的住宿上限和M&IE及适用性）占比至少75%但不足100%。；3=满足要求的城市×财政年度记录（五城×三年度共十五组，每组含实际行程所涉月份的住宿上限和M&IE及适用性）占比至少50%但不足75%。；2=至少一个城市×财政年度记录（五城×三年度共十五组，每组含实际行程所涉月份的住宿上限和M&IE及适用性）满足，但占比不足50%。；1=没有满足要求的城市×财政年度记录（五城×三年度共十五组，每组含实际行程所涉月份的住宿上限和M&IE及适用性），或没有可核查的相关产出。"
type = "likert"
weight = 10
points = 5
annotations = { "dimension" = "内容质量-数值与计算准确性-跨源交叉核对缺失-县域月份财政年度与费率适用性核对", "criterion_type" = "Objective", "criterion_necessity" = "Explicit", "source_type" = "gradient", "dimension_l1" = "内容质量", "dimension_l2" = "数值与计算准确性", "dimension_l3" = "跨源交叉核对缺失", "dimension_l4" = "县域月份财政年度与费率适用性核对", "weakness_ids" = ["W12"] }

[[criterion]]
id = "GO003"
name = "GO003"
description = "按实际行程核算住宿夜数，区分真实房价、报销上限及题设12%住宿税估算。未获超标准授权时，超上限酒店不得作为合规推荐；不能把实际报价截减至上限后参与合规方案成本比较。不暗定四晚，不因有依据的不同抵返日期扣分。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf."
type = "binary"
weight = 10
annotations = { "dimension" = "内容质量-专业规范-无据自造数据与口径-真实房价与报销上限税基区分", "criterion_type" = "Objective", "criterion_necessity" = "Explicit", "source_type" = "binary", "dimension_l1" = "内容质量", "dimension_l2" = "专业规范", "dimension_l3" = "无据自造数据与口径", "dimension_l4" = "真实房价与报销上限税基区分", "weakness_ids" = ["W11"] }

[[criterion]]
id = "GO004"
name = "GO004"
description = "逐日M&IE正确处理首末日75%、扣除整份政府供餐及杂费下限，使用题设全部供餐日期和餐别；酒店免费早餐及茶歇不误作政府供餐扣除。本项评价初始核算。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf."
type = "binary"
weight = 10
annotations = { "dimension" = "内容质量-专业规范-跨源交叉核对缺失-供餐日期与逐日报销规则核对", "criterion_type" = "Objective", "criterion_necessity" = "Implicit", "source_type" = "binary", "dimension_l1" = "内容质量", "dimension_l2" = "专业规范", "dimension_l3" = "跨源交叉核对缺失", "dimension_l4" = "供餐日期与逐日报销规则核对", "weakness_ids" = ["W12"] }

[[criterion]]
id = "GO006"
name = "GO006"
description = "固定比较五城各18人和24人，共十个城市×人数分析组；同组可以含多个行程候选，不要求十组都可行或获批。每个完成组应有可定位的费用明细、计费单位和人数/夜数依据，区分人均、固定及有证据的阶梯费用；机票、住宿、题设住宿税、注册、相关交通、扣除政府供餐后的旅客M&IE、机构供餐、茶歇和场地等适用费用有金额或具体缺口。未排除组须有实际候选机票、住宿及注册费的数值核算；其中任一主要成本仅以空白、TBD或无依据的零占位代替，不计为完成组。已知基础小计、储备及含储备部分估算可从明细复算；未报价费用另列参数、适用范围及计费口径，不能当作零或混入声称完整的总额。允许以可复算的条件总额表达尚缺报价的组，不要求编造报价。有证据证明无法满足硬约束、明确说明排除原因及其对本组适用范围的，可作为完成的排除分析，无需为已排除组合继续采购报价；只遇到访问受限、只写TBD/暂无数据、空行或照抄人数不算完成。缺失或未完成组保留在十组分母中；只评费用覆盖、规模口径及汇总，不重复评价上游政策算法、报价换算或推荐排序。旅客净M&IE纳入53,000美元预算，不得仅列预算外备忘；机构实际供餐费用另计，注册费所含三顿午餐不重复采购。本项只检查费用是否纳入及汇总，不重复评价上游逐日扣餐算法。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf.\n评分为1–5整数。先应用正文中的核心前提和分档上限；正文0/0.25/0.5/0.75/1表示归一化档位，分别对应原始1/2/3/4/5，不得输出小数。五档锚点：5=十组全部达到完整成本分析或有依据的排除分析标准；未知费用的条件口径明确，不以占位行充数。；4=八至九组达到完整分析标准，其余组仍计入分母。；3=五至七组达到完整分析标准。；2=一至四组达到完整分析标准。；1=没有达到完整分析标准的组；仅列十行名称、TBD、零占位或总额而无可复算成本依据不算完成。"
type = "likert"
weight = 10
points = 5
annotations = { "dimension" = "内容质量-数值与计算准确性-多要求 / 多交付物下缺少 Requirement Coverage Accounting-五城两档人数的预算费用覆盖", "criterion_type" = "Objective", "criterion_necessity" = "Explicit", "source_type" = "gradient", "dimension_l1" = "内容质量", "dimension_l2" = "数值与计算准确性", "dimension_l3" = "多要求 / 多交付物下缺少 Requirement Coverage Accounting", "dimension_l4" = "五城两档人数的预算费用覆盖", "weakness_ids" = ["W4"] }

[[criterion]]
id = "GO007"
name = "GO007"
description = "以基准行程的预算、差旅合规和酒店质量准入条件确定推荐，按人数优先、同人数含储备总额最低、完全并列时城市英文名排序。酒店质量筛选须已有证据完成，不能只因房价低于上限或列出待核实清单就认定通过。库存、采购、资金和正式审批可列为执行前提，不要求真实预订或获批。若没有满足准入的组合，须明确目前不能形成合格推荐；允许列补证优先对象，但不得将其称为已满足准入或已证明最优的方案。仅给条件性首选而未证明准入、也未明确无合格推荐，不满足本项。“暂无合格推荐”的判断也须有针对已检索候选及具体准入缺口的分析依据；仅把全城标待核实或没有开展必要比较，不等于完成了推荐判断。无需证明整个市场不存在合格方案。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf."
type = "binary"
weight = 10
annotations = { "dimension" = "内容质量-结论正确性-跨源交叉核对缺失-预算质量准入与基准推荐互证", "criterion_type" = "Objective", "criterion_necessity" = "Explicit", "source_type" = "binary", "dimension_l1" = "内容质量", "dimension_l2" = "结论正确性", "dimension_l3" = "跨源交叉核对缺失", "dimension_l4" = "预算质量准入与基准推荐互证", "weakness_ids" = ["W12"] }

[[criterion]]
id = "GO008"
name = "GO008"
description = "固定覆盖五城×18/24人，共十个比较组；对当前调整后的整团机票额再上涨20%，重算基础费用、储备及含储备总额，与基准对照并判断预算余量或缺口，说明对应的重询、保留、换方案、降人数或无法执行的应对依据。每组须有可复算的压力结果及预算影响；正确标注的参数化结果可以接受，未知票价不能填零当作完整压力测算。经证据确认因硬约束排除且压力情景仍不可能恢复可行性的组，可用明确排除依据完成该组；访问受限或报价缺失不是此类排除。只算初始推荐组或只写“涨价后重询/降人数”不构成全量完成；应对说明可共用，但须能对应各组结果和条件。只评压力情景及其预算影响，不额外要求计算切换阈值或重复评价同一上游报价错误。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf.\n评分为1–5整数。先应用正文中的核心前提和分档上限；正文0/0.25/0.5/0.75/1表示归一化档位，分别对应原始1/2/3/4/5，不得输出小数。五档锚点：5=十组均有正确可复算的压力结果、预算影响及对应应对依据，或有证据完成硬约束排除分析；不把缺报价组移出分母。；4=八至九组完成压力测算及影响分析，其余组有实质缺口。；3=五至七组完成压力测算及影响分析。；2=一至四组完成压力测算及影响分析。；1=没有组完成可复算的压力测算及影响分析；只有无计算依据的原则性应对不计完成。"
type = "likert"
weight = 7
points = 5
annotations = { "dimension" = "内容质量-数值与计算准确性-多要求 / 多交付物下缺少 Requirement Coverage Accounting-十个比较组的压力情景覆盖", "criterion_type" = "Objective", "criterion_necessity" = "Explicit", "source_type" = "gradient", "dimension_l1" = "内容质量", "dimension_l2" = "数值与计算准确性", "dimension_l3" = "多要求 / 多交付物下缺少 Requirement Coverage Accounting", "dimension_l4" = "十个比较组的压力情景覆盖", "weakness_ids" = ["W4"] }

[[criterion]]
id = "GO009"
name = "GO009"
description = "保持人数、行程月日结构、市场报价及其他假设相同，量化FY2025/FY2026相对FY2027的预算差异，区分住宿上限和M&IE变化，判断合规限制与推荐是否改变。历史情景不得冒充历史实际报价或本次报销标准；报价超过旧上限应标不合规/待授权，不得截价宣称可订。零变化结论须有测算支持。本项不重复评价费率表的原始取数。核心前提是有实际候选、固定其他假设且可复算的历史费率成本对照；没有任何一个历史年度的正确量化对照，最高0.25；仅完成一个历史年度，最高0.5。正确的零差异计算可以满足量化要求，费率数值列表或未计算的“无影响”声明不可以。覆盖集合固定为五城×18/24人×FY2025/FY2026相对FY2027，共二十个城市—人数—历史年度对照单元；可用按人均影响及人数换算的共用公式表达，无需机械重复二十行。每单元须有可复算的受控预算差异、相应合规状态及对选址的影响解释。报价未知时允许有依据的参数化差异和合规区间，不能把缺失报价当零而称已完成对照；有支持的零差异仍可计完成。缺失单元保留在分母，满足数值覆盖仍须满足本项原有分析及核心前提。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf.\n评分为1–5整数。先应用正文中的核心前提和分档上限；正文0/0.25/0.5/0.75/1表示归一化档位，分别对应原始1/2/3/4/5，不得输出小数。五档锚点：5=二十个对照单元全部完成受控量化、相应合规及决策影响分析；住宿上限与M&IE的影响区分成立。共用公式明确覆盖相关人数可计完成。；4=至少十五个对照单元完成但不足二十个，且两个历史年度均有正确受控量化；或二十单元量化齐全，仅一项影响解释有实质缺口。；3=十至十四个对照单元完成；或二十单元量化覆盖较高但影响分解、合规及推荐解释有多项实质缺口。仅完成一个历史年度最高本档。；2=一至九个对照单元完成；或只有局部影响、合规分析及未完成的计算依据，没有任何一个正确可复算的受控对照。；1=没有可核查的历史影响分析或计算依据。"
type = "likert"
weight = 7
points = 5
annotations = { "dimension" = "内容质量-分析与论证质量-跨源交叉核对缺失-受控历史费率情景与决策影响核对", "criterion_type" = "Objective", "criterion_necessity" = "Explicit", "source_type" = "gradient", "dimension_l1" = "内容质量", "dimension_l2" = "分析与论证质量", "dimension_l3" = "跨源交叉核对缺失", "dimension_l4" = "受控历史费率情景与决策影响核对", "weakness_ids" = ["W12"] }

[[criterion]]
id = "GO010"
name = "GO010"
description = "UTF-8 approval_register.csv可读取，针对差旅授权、住宿/场地资质、采购、资金及申请表缺项列出具体事项、拟负责角色、所需证据、建议期限和是否阻断批准。只评可执行的补证登记，不重复评分其他交付中的待核实标记。每类完成须能据具体事项、拟负责角色、应取得的证据、可执行期限和阻断状态采取行动；五栏全部填“待核实”、复用无对象的模板句不计完成。尚未知具体责任人可写拟负责职能，尚无采购报价可列明确询价请求，相对期限可以接受，不要求编造联系人或完成日期。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf.\n评分为1–5整数。先应用正文中的核心前提和分档上限；正文0/0.25/0.5/0.75/1表示归一化档位，分别对应原始1/2/3/4/5，不得输出小数。五档锚点：5=全部应评补证类别（差旅授权、住宿/场地资质、采购、资金、申请表缺项五类；每类须有适用事项、角色、证据、期限及阻断状态）满足本项要求。；4=满足要求的补证类别（差旅授权、住宿/场地资质、采购、资金、申请表缺项五类；每类须有适用事项、角色、证据、期限及阻断状态）占比至少75%但不足100%。；3=满足要求的补证类别（差旅授权、住宿/场地资质、采购、资金、申请表缺项五类；每类须有适用事项、角色、证据、期限及阻断状态）占比至少50%但不足75%。；2=至少一个补证类别（差旅授权、住宿/场地资质、采购、资金、申请表缺项五类；每类须有适用事项、角色、证据、期限及阻断状态）满足，但占比不足50%。；1=没有满足要求的补证类别（差旅授权、住宿/场地资质、采购、资金、申请表缺项五类；每类须有适用事项、角色、证据、期限及阻断状态），或没有可核查的相关产出。"
type = "likert"
weight = 7
points = 5
annotations = { "dimension" = "内容质量-分析与论证质量-多要求 / 多交付物下缺少 Requirement Coverage Accounting-审批补证类别与可执行字段覆盖", "criterion_type" = "Objective", "criterion_necessity" = "Explicit", "source_type" = "gradient", "dimension_l1" = "内容质量", "dimension_l2" = "分析与论证质量", "dimension_l3" = "多要求 / 多交付物下缺少 Requirement Coverage Accounting", "dimension_l4" = "审批补证类别与可执行字段覆盖", "weakness_ids" = ["W4"] }

[[criterion]]
id = "GO011"
name = "GO011"
