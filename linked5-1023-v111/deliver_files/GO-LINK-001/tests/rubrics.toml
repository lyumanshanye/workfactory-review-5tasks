description = "实际采用的报价须对应所需日期、房型、单人入住及含早餐条件；早餐另收费时计入可核实费用并核对需求。单程/往返、每人/每间、每晚/全程、币种及税费换算正确，不漏已明示必要费用。可按单人或单间报价作明确标注的整团暂估，但不得声称已确认多人同价或库存；团体价格及可用数量未核实须列执行条件。只评报价适配与换算，不评价截图证据组的数量与覆盖。完成组必须有可识别的具体报价、适用日期、计价单位及核算结果；无报价金额或日期、只写待询价的组不计完成，不因未取到报价而移出十组分母。缺少截图不直接等于报价换算错误，应以可追溯的实际报价内容核查；原网页未披露早餐或必要税费时，不得声称已满足条件，条件性暂估不冒充完整适配结果。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf.\n评分为1–5整数。先应用正文中的核心前提和分档上限；正文0/0.25/0.5/0.75/1表示归一化档位，分别对应原始1/2/3/4/5，不得输出小数。五档锚点：5=全部应评城市×报价核算组（五城各一组往返机票和一组住宿，共十组；仅评该组适配与换算，不评价截图是否齐全）满足本项要求。；4=满足要求的城市×报价核算组（五城各一组往返机票和一组住宿，共十组；仅评该组适配与换算，不评价截图是否齐全）占比至少75%但不足100%。；3=满足要求的城市×报价核算组（五城各一组往返机票和一组住宿，共十组；仅评该组适配与换算，不评价截图是否齐全）占比至少50%但不足75%。；2=至少一个城市×报价核算组（五城各一组往返机票和一组住宿，共十组；仅评该组适配与换算，不评价截图是否齐全）满足，但占比不足50%。；1=没有满足要求的城市×报价核算组（五城各一组往返机票和一组住宿，共十组；仅评该组适配与换算，不评价截图是否齐全），或没有可核查的相关产出。"
