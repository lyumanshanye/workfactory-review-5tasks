id = "GO038"
name = "GO038"
description = "从实际记录的联合候选及其整团已知费用、机票费用和未知费用条件，计算0至20%票价涨幅内有效的推荐切换边界，或给出可复算的无切换证明。结果可为数值阈值或含明确费用差条件的表达式；正确处理平行、区间外或不可行交点。边界须符合预算及可行性，并经其他已记录候选核验，不能把任意两方案费用相等当作整体最优切换。未知费用不默认相同；限制适用条件须明确。无正确、可复算的具体候选阈值或无切换证明，最高0.25；只有正确的两两比较而未证明有效最优边界，最高0.5。不强求发生切换，不要求整数规划符号或特定求解器。不能通过不记录题面指定的城市或人数档，自行缩小已证明最优的范围。对必需比较但研究未完成的竞争对象，须保留为未决对象并给出结论成立的费用/可行性条件，或有依据证明其不会推翻当前边界或行动；单纯称其“不在本次分析范围”不构成完整证明。仍允许有明确条件的关键区域分析，不要求穷举市场或无条件证明全局稳健最优。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf.\n评分为1–5整数。先应用正文中的核心前提和分档上限；正文0/0.25/0.5/0.75/1表示归一化档位，分别对应原始1/2/3/4/5，不得输出小数。五档锚点：5=关键切换边界或无切换结论正确可复算，未知费用条件明确，已核验边界两侧预算、可行性和其他已记录候选；可作为声明范围内的最优切换依据。；4=主要有效边界及竞争候选核验成立，仅有不影响主要结论的特殊情况说明或次要边界缺口。；3=至少一个具体候选对的阈值或条件性无切换结论正确可复算，但缺少预算/可行性或其他候选的充分核验，尚不能证明其为有效最优边界。；2=只有变量、通用公式、定性比较或错误阈值，没有正确可复算的具体候选阈值或有依据的无切换证明。；1=没有阈值或无切换分析，或无法识别其比较对象与费用依据。"
type = "likert"
weight = 10
points = 5
annotations = { "dimension" = "内容质量-数值与计算准确性-无据自造数据与口径-未知费用条件与有效切换边界口径", "criterion_type" = "Objective", "criterion_necessity" = "Explicit", "source_type" = "gradient", "dimension_l1" = "内容质量", "dimension_l2" = "数值与计算准确性", "dimension_l3" = "无据自造数据与口径", "dimension_l4" = "未知费用条件与有效切换边界口径", "weakness_ids" = ["W11"] }

[[criterion]]
id = "GO039"
name = "GO039"
description = "计算基准和票价上涨20%时可承受的待询价基础费用上限，正确处理整团机票额与储备。核心核查对象固定为推荐组合及最有竞争力的有效备选各两种情景，通常共四个结果；暂无合格推荐时，可分析明确标注的优先补证组合。备选由已记录候选的费用与可行性核对确定，不能通过少列或挑弱备选缩小分母；确无有效备选须提供可核查排除依据，经确认后可只评推荐组合的两个结果。未提供的应评结果计未完成。至少检查默认预算与一个允许范围内导致已知费用超预算的预算值；负上限须保留并明确表示已超预算，不能截成零冒充可采购金额。只给默认正值而未正确处理负值情景，不能满分。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf.\n评分为1–5整数。先应用正文中的核心前提和分档上限；正文0/0.25/0.5/0.75/1表示归一化档位，分别对应原始1/2/3/4/5，不得输出小数。五档锚点：5=固定应评集合全部结果正确可复算，且改预算后的负上限含义和显示正确；无通过缩小集合回避有效备选的情况。；4=固定应评结果至少75%但不足100%正确；或默认应评结果全部正确，但负上限处理错误或尚无验证依据。该档仍须至少75%的默认应评结果正确。；3=固定应评结果至少50%但不足75%正确可复算。；2=至少一个固定应评结果正确但占比不足50%；仅列公式而无任何候选计算结果不计完成。；1=固定应评结果均缺失或错误，没有可复算的候选费用上限。"
type = "likert"
weight = 10
points = 5
annotations = { "dimension" = "内容质量-数值与计算准确性-无据自造数据与口径-待询价基础费用上限与含储备余额区分", "criterion_type" = "Objective", "criterion_necessity" = "Explicit", "source_type" = "gradient", "dimension_l1" = "内容质量", "dimension_l2" = "数值与计算准确性", "dimension_l3" = "无据自造数据与口径", "dimension_l4" = "待询价基础费用上限与含储备余额区分", "weakness_ids" = ["W11"] }

[[criterion]]
id = "GO040"
name = "GO040"
description = "给出在明确票价涨幅、未知费用条件和可行性条件下的分段行动规则，说明何时保留推荐、换有效竞争备选、从24人降为18人或两档均不可行。每个声称成立的推荐区域须覆盖已记录候选，不能因某个两两条件成立就直接宣布整体最优。允许只给推荐成立及会推翻它的关键区域，须明确未覆盖范围，不要求穷举所有未知费用组合或每种切换都发生。人数优先于同人数成本；规模变化区分人均、固定及有证据的阶梯/容量费用，未知费用保留条件，不编造折扣或把整团总额直接按人数比例缩放。本项只评区域、行动和规模变化逻辑，不重复评价同一上游阈值算术错误。仅有口号式降档规则而无具体数值或参数条件，最高0.25；仅局部两方案规则却声称整体最优，最高0.5。不能通过不记录题面指定的城市或人数档，自行缩小已证明最优的范围。对必需比较但研究未完成的竞争对象，须保留为未决对象并给出结论成立的费用/可行性条件，或有依据证明其不会推翻当前边界或行动；单纯称其“不在本次分析范围”不构成完整证明。仍允许有明确条件的关键区域分析，不要求穷举市场或无条件证明全局稳健最优。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx, output/conference_attendance_approval.pdf.\n评分为1–5整数。先应用正文中的核心前提和分档上限；正文0/0.25/0.5/0.75/1表示归一化档位，分别对应原始1/2/3/4/5，不得输出小数。五档锚点：5=声明的主要区域有可核对的数值或参数条件，各区域的最优选择、备选、人数优先、预算可行性及规模费用逻辑正确，并核对所有已记录候选；未覆盖范围明确。；4=主要推荐区域和行动成立，其他候选与人数优先核验充分，仅有次要边界或非核心费用分层说明缺口。；3=有可复算的局部区域和行动，但全局适用范围、竞争候选、人数降档或规模费用处理存在实质缺口；局部结论不得冒充已完成全局证明。；2=只有先24人后18人、超预算换方案等一般原则，没有可执行的具体数值或参数条件；或行动与其给定条件基本脱节。；1=没有可用的分段行动条件，或无法判断任何条件下应采取何种行动。"
type = "likert"
weight = 10
points = 5
annotations = { "dimension" = "内容质量-结论正确性-跨源交叉核对缺失-分段行动与竞争候选及人数约束互证", "criterion_type" = "Objective", "criterion_necessity" = "Explicit", "source_type" = "gradient", "dimension_l1" = "内容质量", "dimension_l2" = "结论正确性", "dimension_l3" = "跨源交叉核对缺失", "dimension_l4" = "分段行动与竞争候选及人数约束互证", "weakness_ids" = ["W12"] }

