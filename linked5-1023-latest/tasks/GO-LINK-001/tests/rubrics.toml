[judge]
judge = "claude-code"
prompt_template = "prompt.md"
model = "qwen3.7-plus"
timeout = 7200
mode = "individual"
weight = 1.0

[[criterion]]
id = "GO001"
name = "GO001"
type = "binary"
description = "依据所给GSA离线页面和附件引用实际费率或M&IE资料，说明其预算用途，引用可追溯至提供的真实材料；不要求联网或使用固定引用格式。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 7

[[criterion]]
id = "GO002"
name = "GO002"
type = "binary"
description = "三城市逐日按县、季节及适用财政年度正确匹配住宿与M&IE费率，来源和适用日期可追溯；不强制提供原表行号。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 10

[[criterion]]
id = "GO003"
name = "GO003"
type = "binary"
description = "默认行程四晚住宿按实际报价及适用报销上限正确计费，住宿税按题设可报销住宿金额的12%另计；调整到达日时采用实际住宿夜数，不把内部税率估算表述为法定税率。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 10

[[criterion]]
id = "GO004"
name = "GO004"
type = "binary"
description = "首末日M&IE先按75%计算再扣整份政府供餐金额，保留杂费下限；其他日供餐扣减正确。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 10

[[criterion]]
id = "GO005"
name = "GO005"
type = "binary"
description = "酒店免费早餐及茶歇不误扣；政府供餐日期和餐别全部使用。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 7

[[criterion]]
id = "GO006"
name = "GO006"
type = "binary"
description = "六方案人数、机票、当地交通、注册和固定场地费不重复/遗漏，基础总额准确到分。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 10

[[criterion]]
id = "GO007"
name = "GO007"
type = "binary"
description = "5%储备与53000预算正确比较，先人数后成本的选址/人数决定正确。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 10

[[criterion]]
id = "GO008"
name = "GO008"
type = "binary"
description = "机票加20%的六方案压力预算和可执行超限措施正确。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 7

[[criterion]]
id = "GO009"
name = "GO009"
type = "binary"
description = "解释跨财政年度版本选择及本次实际费率是否变化，不凭版本变化推定涨价。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 7

[[criterion]]
id = "GO010"
name = "GO010"
type = "binary"
description = "审批登记覆盖差旅授权、住宿与场地资质、采购和资金确认，分别列明拟负责角色、所需证据、建议期限及是否阻断批准。本项评价待办登记的完整性；虚构已获审批的扣分只由GO018处理。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 7

[[criterion]]
id = "GO011"
name = "GO011"
type = "binary"
description = "三份精确命名交付均可读，工作簿含Daily/Options/Sources，金额单位、来源和假设清楚。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 3

[[criterion]]
id = "GO012"
name = "GO012"
type = "binary"
description = "批准简报与工作簿/CSV的推荐、关键金额和条件一致，内部建议与FTR义务明确区分。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 7

[[criterion]]
id = "GO013"
name = "GO013"
type = "binary"
description = "在题面允许范围内实际修改预算上限、票价系数、储备比例及到达日后，工作簿的有效旅行日期、住宿夜数和各方案基础额、储备、总额、余量与机票压力总额正确联动。至少用两组非默认参数验证；接受任意清楚可编辑的布局和等价公式，不要求特定命名区域或程序接口。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 10

[[criterion]]
id = "GO014"
name = "GO014"
type = "binary"
description = "将9月29日政府早餐从“否”改为“是”后，三地当日M&IE及各方案费用按附件规则正确联动；到达日改为9月29日的情景仍正确处理首日比例与供餐扣减，不把酒店免费早餐误作新增政府供餐扣除。恢复默认参数后回到原计算结果。不要求特定命名区域。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 10

[[criterion]]
id = "GO015"
name = "GO015"
type = "binary"
description = "实际改值后，推荐依当前工作簿各方案的可行性，按人数优先、同人数含储备总额最低及城市英文名顺序更新；无可行方案时明确显示无可批准方案。明确提示Word和CSV为默认参数快照，输入变更后须重新核对并导出。检查可行、不可行及恢复默认三种情况；排序按当前计算值评价，数值错误不在本项重复扣分。不要求特定命名输出。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 10

[[criterion]]
id = "GO016"
name = "GO016"
type = "binary"
description = "实际操作预算工作簿并保存、重新打开后，原有输入数据、计算公式和内部引用保持完整，没有因改值或格式转换造成数据或公式意外丢失、文件损坏。只检查交付完整性，不重复评价金额是否正确；不得凭缺少操作日志臆测源材料被破坏。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 10

[[criterion]]
id = "GO017"
name = "GO017"
type = "binary"
description = "审批简报的信息组织便于负责人定位推荐、备选、预算依据、机票上涨影响及批准前提；这些内容的层级和关联清楚，不要求固定章节名称或版式。本项只评价组织与可定位性，不重复评价结论和金额。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 7

[[criterion]]
id = "GO018"
name = "GO018"
type = "binary"
description = "交付物在无材料支持的情况下，将尚待核实的差旅授权、采购批准、场地资质或资金落实事项陈述为已经确认、获批或完成，可能使负责人误以为可以直接执行。仅在存在明确的无依据完成声明时触发扣分；遗漏某条待办、建议性表述、条件性批准或清楚标注“待核实”均不触发。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv."
weight = 7
negate = true

[scoring]
aggregation = "weighted_mean"
