[judge]
judge = "claude-code"
prompt_template = "prompt.md"
model = "qwen3.7-plus"
timeout = 7200
mode = "individual"
weight = 1.0

[[criterion]]
id = "GO001"
name = "GO001"
type = "binary"
description = "行程与费用估算具有可追溯来源、查询日期及适用条件；明确区分可核实价格、估算和待询价，不以缺失数据或未核实预订充当事实。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO002"
name = "GO002"
type = "binary"
description = "五个候选城市按实际行程、县域、月份及适用财政年度正确匹配住宿和M&IE费率；不得把自然年2026直接等同于FY2026，不要求原表行号。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 10

[[criterion]]
id = "GO003"
name = "GO003"
type = "binary"
description = "住宿夜数按所荐行程计算，区分住宿报价、适用报销上限和未获超标准授权的限制；住宿税按题设可报销金额的12%计算。不暗定四晚，不因合理的不同抵返安排扣分。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 10

[[criterion]]
id = "GO004"
name = "GO004"
type = "binary"
description = "首末日M&IE先按75%计算再扣整份政府供餐金额，保留杂费下限；其他日供餐扣减正确。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 10

[[criterion]]
id = "GO005"
name = "GO005"
type = "binary"
description = "酒店免费早餐及茶歇不误扣；政府供餐日期和餐别全部使用。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO006"
name = "GO006"
type = "binary"
description = "完整比较五个候选城市及18人、24人两档规模，区分人均与固定费用，金额可由明细复算；待询价或缺失费用不得当作零成本。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 10

[[criterion]]
id = "GO007"
name = "GO007"
type = "binary"
description = "储备与53,000美元预算上限比较正确，按合规与证据充分性判断可行性，再按人数优先、同人数成本及城市英文名排序提出有条件的推荐；不要求命中特定城市。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 10

[[criterion]]
id = "GO008"
name = "GO008"
type = "binary"
description = "对所比较方案按当前机票估算上涨20%重算，给出有依据的预算影响和可执行应对安排。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO009"
name = "GO009"
type = "binary"
description = "行程覆盖完整培训，并考虑提前抵达、次日返回的休息建议；日期、时区与直达或中转安排有依据，不暗定抵返日期或必须中转。机场及接驳的比较由GO021评价。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO010"
name = "GO010"
type = "binary"
description = "审批登记覆盖差旅授权、住宿与场地资质、采购和资金确认，分别列明拟负责角色、所需证据、建议期限及是否阻断批准。本项评价待办登记的完整性；虚构已获审批的扣分只由GO018处理。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO011"
name = "GO011"
type = "binary"
description = "四份精确命名交付均可读，工作簿含Daily/Options/Sources，金额单位、来源和假设清楚。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 3

[[criterion]]
id = "GO012"
name = "GO012"
type = "binary"
description = "批准简报、PPT与工作簿/CSV的推荐、关键金额和条件一致，内部建议与FTR义务明确区分。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO013"
name = "GO013"
type = "binary"
description = "实际修改预算、票价系数、储备或抵返日期后，旅行日期、住宿夜数、各方案费用、余量及压力总额正确联动；至少用两组合理参数检查，不要求特定命名区域。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 10

[[criterion]]
id = "GO014"
name = "GO014"
type = "binary"
description = "将11月29日政府早餐由否改是后，当日M&IE及候选方案费用正确联动，按实际行程处理首末日与供餐规则；酒店含早餐不误作政府供餐扣除。恢复参数后结果恢复，不要求固定抵返日期。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 10

[[criterion]]
id = "GO015"
name = "GO015"
type = "binary"
description = "实际改值后，工作簿的推荐按当前可行性、人数优先及同人数成本更新；无可行方案时明确提示，不保留旧的可批准结论。排序按当前计算值评价，计算错误不在本项重复扣分；快照提示由GO027评价。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 10

[[criterion]]
id = "GO016"
name = "GO016"
type = "binary"
description = "实际操作预算工作簿并保存、重新打开后，原有输入数据、计算公式和内部引用保持完整，没有因改值或格式转换造成数据或公式意外丢失、文件损坏。只检查交付完整性，不重复评价金额是否正确；不得凭缺少操作日志臆测源材料被破坏。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 10

[[criterion]]
id = "GO017"
name = "GO017"
type = "binary"
description = "审批简报及PPT的信息组织便于负责人定位推荐、备选、预算依据、机票上涨影响及批准前提；这些内容的层级和关联清楚，不要求固定章节名称或版式。本项只评价组织与可定位性，不重复评价结论和金额。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO018"
name = "GO018"
type = "binary"
description = "交付物无依据编造已核实航班、供应商报价、预订或已完成审批、资质、资金落实，且将其用于预算或批准结论。仅有明确虚构事实才扣分；清楚标注的估算、待询价、条件性建议或待核实不触发。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7
negate = true

[[criterion]]
id = "GO019"
name = "GO019"
type = "binary"
description = "PPT包含五城实际采用的具体往返航班与住宿报价的真实网页截图，能辨认航线、日期、房型或人数口径、币种及金额，不以自制表格、文字摘抄或重绘图片替代。截图与预算的换算核对由GO022评价。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 10

[[criterion]]
id = "GO020"
name = "GO020"
type = "binary"
description = "PPT版式整洁、信息层级与截图说明的对应关系清楚，航班和住宿金额可在正常查看尺寸下辨认；没有遮挡关键信息的裁切、重叠、文字溢出或影响比较的过度缩放。只评价视觉呈现，不重复评价价格计算或来源真实性，不强制特定模板、配色或页数。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO021"
name = "GO021"
type = "binary"
description = "比较华盛顿地区合理的出发机场，结合往返机场接驳成本、时间和航班安排说明取舍，相关可计费用进入预算；不只按裸票价推荐。不强制穷举机场或选DCA。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO022"
name = "GO022"
type = "binary"
description = "PPT截图报价与Excel对应金额一致；单程与往返、每人或每间、每晚与全程、币种及含税口径的换算正确，人数和夜数可复算。不把单人或单间报价冒充整团已确认库存。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 10

[[criterion]]
id = "GO023"
name = "GO023"
type = "binary"
description = "正确处理实际报价中已明示的必要税费、服务费、早餐等包含条件，不仅取宣传起价而遗漏已明示必要费用。不强制购买未要求的附加服务，无法核实的费用可列待确认。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO024"
name = "GO024"
type = "binary"
description = "Sources及PPT记录实际报价的原始URL、查询时间、所对应的出行或入住日期及关键价格条件，政策与费率版本可追溯。只评溯源记录，不重复评价金额正确性。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO025"
name = "GO025"
type = "binary"
description = "按农村发展局RD Instruction 2036-A识别适用的差旅与会议培训审批要求及批准前提；不以预算未超限替代机构审批，不借用其他部门或过期通知的权限阈值。未核实条款须如实标明。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO026"
name = "GO026"
type = "binary"
description = "说明影响比较或执行的重要信息缺口、对推荐的限制及所需补证；待询价不能按零成本视作可行，依据不完整时不能声称已无条件充分比较五城。允许有依据且适用条件明确的推荐。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO027"
name = "GO027"
type = "binary"
description = "工作簿明确提示Word、CSV和PPT为交付时行程与参数快照，参数变更后须重新核对并导出；不得声称静态文档已随Excel自动更新。只评价交接提示，不重复评价初始金额一致性。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 7

[[criterion]]
id = "GO028"
name = "GO028"
type = "binary"
description = "approval_register.csv为可正常读取的UTF-8 CSV，包含事项、拟负责角色、所需证据、建议完成期限及是否阻断批准字段。仅评编码、可读性和字段，登记内容由GO010评价。\nInspect output/conference_budget.xlsx, output/approval_brief.docx, output/approval_register.csv, output/travel_evidence.pptx."
weight = 3

[scoring]
aggregation = "weighted_mean"
