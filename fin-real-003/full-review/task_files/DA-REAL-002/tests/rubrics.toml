[judge]
judge = "claude-code"
prompt_template = "prompt.md"
model = "qwen3.7-plus"
timeout = 7200
mode = "individual"
weight = 1.0

[[criterion]]
id = "DA001"
name = "DA001"
weight = 10.0
type = "binary"
description = "核实四表粒度、年份、候选键和重复，保留脚注与非数值标记审计。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA002"
name = "DA002"
weight = 7.0
type = "binary"
description = "依据实际LineCode选取CAINC1总收入/人口/人均值。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA003"
name = "DA003"
weight = 7.0
type = "binary"
description = "依据实际LineCode选取CAINC4总收入和三项收入分量。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA004"
name = "DA004"
weight = 7.0
type = "binary"
description = "GeoFIPS正规化保留前导零，不用模糊地名补关联。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA005"
name = "DA005"
weight = 7.0
type = "binary"
description = "Census按SUMLEV=050取县，州和全国行不混入县统计。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA006"
name = "DA006"
weight = 7.0
type = "binary"
description = "不因五位代码就把BEA都会区/合并区视作Census县。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA007"
name = "DA007"
weight = 10.0
type = "binary"
description = "双向报告BEA两表与Census的地域覆盖和集合差异。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA008"
name = "DA008"
weight = 7.0
type = "binary"
description = "比较2020县代码表与人口表实际代码差异，不以旧表静默删新县。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA009"
name = "DA009"
weight = 7.0
type = "binary"
description = "无官方对照时不拆分合并地域或合成分配人口。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA010"
name = "DA010"
weight = 7.0
type = "binary"
description = "2020—2024逐县核验BEA两表总收入口径及数值。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA011"
name = "DA011"
weight = 7.0
type = "binary"
description = "2020—2024核验净劳动/财产/转移收入与总收入加总关系。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA012"
name = "DA012"
weight = 7.0
type = "binary"
description = "对可直接关联县保留2020/2024两套人口与绝对差。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA013"
name = "DA013"
weight = 7.0
type = "binary"
description = "人口相对差分母使用Census人口，方向与绝对排名明确。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA014"
name = "DA014"
weight = 7.0
type = "binary"
description = "两套重算人均收入正确处理千美元到美元换算。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA015"
name = "DA015"
weight = 7.0
type = "binary"
description = "核验BEA发布人均值并区分四舍五入与人口口径差异。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA016"
name = "DA016"
weight = 7.0
type = "binary"
description = "人口差异前20按2024绝对相对差排序，FIPS并列升序。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA017"
name = "DA017"
weight = 10.0
type = "binary"
description = "差异案例定位真实源行，不自动宣称官方数据错误。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA018"
name = "DA018"
weight = 7.0
type = "binary"
description = "增长候选集满足题面两端收入/分项/人口正值及跨表一致条件。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA019"
name = "DA019"
weight = 7.0
type = "binary"
description = "逐条保留排除原因，不将(D)/(NA)/(NM)和其他非数值标记填0。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA020"
name = "DA020"
weight = 7.0
type = "binary"
description = "总收入与两套人口增长率计算正确。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA021"
name = "DA021"
weight = 7.0
type = "binary"
description = "两套人均收入增长率基于2020到2024的未四舍五入端点。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA022"
name = "DA022"
weight = 7.0
type = "binary"
description = "两套前20排名各自排序/并列处理正确，不直接复用同一排名。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA023"
name = "DA023"
weight = 7.0
type = "binary"
description = "正确比较前20集合与排名变化，不编造不同结果。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA024"
name = "DA024"
weight = 7.0
type = "binary"
description = "三分项贡献用各分项收入增量/基期总收入，单位百分点并允许负贡献。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA025"
name = "DA025"
weight = 7.0
type = "binary"
description = "对数分解正确，零/负值不取对数，人口方向为减。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA026"
name = "DA026"
weight = 7.0
type = "binary"
description = "明确名义增长不等于通胀调整后生活水平改善。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA027"
name = "DA027"
weight = 3.0
type = "binary"
description = "工作簿含题面五张分析表，数值可读、表头/单位/筛选完整。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA028"
name = "DA028"
weight = 7.0
type = "binary"
description = "JSON与表格、备忘录关键数据一致，保留源文件/FIPS/LineCode/年份/行号。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA029"
name = "DA029"
weight = 10.0
type = "binary"
description = "脚本从原始字节离线计算，正确处理编码，不修改输入、不硬编码答案。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA030"
name = "DA030"
weight = 3.0
type = "binary"
description = "四份文件可打开，业务备忘录结论在前并明确可比集合范围。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."

[[criterion]]
id = "DA031"
name = "DA031"
weight = 10.0
type = "binary"
description = "捏造原始数据、案例事实、外部文献或条款原文，并声称已核实，触发此扣分项。普通计算错误、遗漏或定位不精确不自动等同于伪造。\nInspect output/audit.xlsx, output/memo.docx, output/results.json, output/analysis.py."
negate = true

[scoring]
aggregation = "weighted_mean"
